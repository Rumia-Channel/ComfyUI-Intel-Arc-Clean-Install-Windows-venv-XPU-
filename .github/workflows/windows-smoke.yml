name: Windows installer smoke checks

on:
  push:
  pull_request:

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell entry points (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failures = 0
          Get-ChildItem -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($errorItem in $errors) {
              Write-Host ("{0}: {1}" -f $_.Name, $errorItem.Message)
              $failures++
            }
          }
          if ($failures -ne 0) { exit 1 }
      - name: Check entry points and safety invariants
        shell: powershell
        run: |
          $core = Get-Content -Raw .\ComfyUI-XPU.ps1
          foreach ($required in @('whl/xpu', 'whl/nightly/xpu', 'manager_requirements.txt', 'pull', '--ff-only', 'verify_environment.py', 'ComfyUI-GGUF', 'Resolve-ComfyInstallPath', 'Save-ComfyInstallPathMarker', 'uv', '--managed-python')) {
            if (-not $core.Contains($required)) { throw "Missing expected behavior: $required" }
          }
          if (-not (Get-Content -Raw .\scripts\verify_environment.py).Contains('torch.xpu.is_available()')) { throw 'XPU probe missing' }
          if ($core -match 'Remove-Item|reset --hard|rmdir /s') { throw 'Unexpected destructive installation behavior' }
          if (-not $core.Contains('Test-ComfyExistingCheckout -Directory $InstallPath')) { throw 'Installer must check clone destination for empty existing folders' }
          if ($core -match "-m', 'pip'|python -m venv") { throw 'Legacy pip/venv setup remains' }
          if (-not $core.Contains("'pip', 'install', '--python', " + '$VenvPython')) { throw 'uv must install into the selected venv' }
          Get-ChildItem -Filter '*.bat' | ForEach-Object {
            $body = Get-Content -Raw $_.FullName
            if (-not $body.Contains('ComfyUI-XPU.ps1')) { throw "Batch wrapper does not use shared installer: $($_.Name)" }
            if (-not $body.Contains('if defined INSTALL_DIR')) { throw "Batch wrapper must forward paths only when explicitly specified: $($_.Name)" }
          }
          Get-ChildItem -Filter '*.ps1' | Where-Object { $_.Name -ne 'ComfyUI-XPU.ps1' } | ForEach-Object {
            $wrapper = Get-Content -Raw $_.FullName
            if (-not $wrapper.Contains("PSBoundParameters.ContainsKey('InstallPath')")) {
              throw "PowerShell wrapper must forward paths only when explicitly specified: $($_.Name)"
            }
          }
      - name: Test install-location prompt, marker and Git ignore
        shell: powershell
        run: |
          & .\scripts\test_install_path.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Install-location tests failed' }
      - name: Test existing-empty directory clone and nonempty directory protection
        shell: powershell
        run: |
          & .\scripts\test_install_target.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Install-destination regression tests failed' }
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Exercise uv-managed Python check and virtual environment on Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\ComfyUI-XPU.ps1 -Mode CheckPython
          if ($LASTEXITCODE -ne 0) { throw 'uv-managed Python check failed' }
          $venv = Join-Path $env:RUNNER_TEMP 'comfy uv smoke\comfyui_venv'
          uv venv --python 3.12 --managed-python $venv
          if ($LASTEXITCODE -ne 0) { throw 'uv venv failed' }
          & (Join-Path $venv 'Scripts\python.exe') .\scripts\verify_environment.py python
          if ($LASTEXITCODE -ne 0) { throw 'uv venv Python version check failed' }
          uv pip list --python (Join-Path $venv 'Scripts\python.exe')
          if ($LASTEXITCODE -ne 0) { throw 'uv pip --python could not target the venv' }
      - name: Exercise XPU diagnostics without GPU hardware (mocked torch)
        shell: powershell
        run: |
          python .\scripts\verify_environment.py python
          if ($LASTEXITCODE -ne 0) { throw 'Python version diagnostic failed' }
          $mockDir = Join-Path $env:RUNNER_TEMP 'mock_torch'
          New-Item -ItemType Directory -Path $mockDir -Force | Out-Null
          @'
          __version__ = "test-mock"
          class XPU:
              @staticmethod
              def is_available():
                  return True
              @staticmethod
              def get_device_name(index):
                  return "Mock Arc GPU"
          xpu = XPU()
          '@ | Set-Content -Path (Join-Path $mockDir 'torch.py') -Encoding UTF8
          $env:PYTHONPATH = $mockDir
          python .\scripts\verify_environment.py xpu
          if ($LASTEXITCODE -ne 0) { throw 'Mocked XPU-available check failed' }
          @'
          __version__ = "test-mock"
          class XPU:
              @staticmethod
              def is_available():
                  return False
          xpu = XPU()
          '@ | Set-Content -Path (Join-Path $mockDir 'torch.py') -Encoding UTF8
          python .\scripts\verify_environment.py xpu
          if ($LASTEXITCODE -ne 4) { throw 'Mocked XPU-unavailable check did not return 4' }
          $global:LASTEXITCODE = 0 # The nonzero exit was expected; keep the GitHub step successful.
